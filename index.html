const nets=d=>d.networks||[];
const vis=d=>(d.servers||[]).filter(s=>!S.pref.net||s.allNets||(s.networkIds||[]).includes(S.pref.net));
function fixPref(d){const p=S.pref;if(!nets(d).some(n=>n.id===p.net))p.net=nets(d)[0]?.id||'';const l=vis(d);if(!l.some(s=>s.id===p.srv))p.srv=l[0]?.id||'';ls.set('vip_net',p.net);ls.set('vip_srv',p.srv)}
const subFor=(d,a)=>{const m=(a&&/^v2box:/i.test(a.scheme||'')&&d.subUrlsV2box)||d.subUrls||{};return m[S.pref.net]||m['']||''};   /* V2Box gets its own link, locked to the V2Box app */
const plat=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)?'ios':/Android/i.test(navigator.userAgent)?'android':'pc';
const importLink=(a,raw,nm)=>{const s=a.scheme||'';if(!raw||!/^[a-z][a-z0-9+.\-]*:\/\//i.test(s)||/^(javascript|data|vbscript|file):/i.test(s))return'';
 const v2=/^v2box:/i.test(s),u=encodeURIComponent(v2?raw+'#'+nm:raw);   /* V2Box: name also goes in the #title of the URL */
 let l=s.split('{url}').join(u).split('{raw}').join(raw).split('{name}').join(encodeURIComponent(nm));
 if(v2&&!/[?&]lock(ed)?=/i.test(l))l+=(l.includes('?')?'&':'?')+'lock=true';   /* V2Box: locked import */
 return l};
const isHapp=a=>/^happ:/i.test(a.scheme||'');
const netName=d=>(nets(d).find(n=>n.id===S.pref.net)||{}).name||'';
const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
const tileOf=a=>{const i=(a.icon||'').trim(),emo=i&&!/^https?:/i.test(i)&&!/^fa[-\s]/i.test(i)&&i.length<=4;
 return`<span class="tile" style="--h:${hue(a.name)}">${emo?esc(i):esc((a.name||'?')[0].toUpperCase())}${/^https?:\/\//i.test(i)?`<img src="${esc(i)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`};
async function copy(t,btn,label){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}
 toast('Copied to clipboard');if(!btn)return;const o=btn.innerHTML;btn.classList.add('ok');btn.innerHTML=ic('check')+(btn.classList.contains('ic')?'':'Copied');setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o},1800)}
const top=()=>`<div class="top"><div class="brand"><span class="ib glass" style="width:40px;height:40px;color:var(--acc)">${ic('crown')}</span>${esc(C.NAME||'VIP')}</div><button class="ib glass" data-act="logout" aria-label="Log out">${ic('out')}</button></div>`;

/* login lockout (kept in this browser; the server also limits per IP) */
const lockLeft=()=>Math.max(0,Math.ceil((+(ls.get('vip_lock')||0)-Date.now())/1000));
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function addFail(code){const n=(+(ls.get('vip_fails')||0))+1;ls.set('vip_fails',n);const s=code===429?600:n>=6?600:n===5?180:n===4?60:n===3?30:0;if(s)ls.set('vip_lock',Date.now()+s*1000);return n}
function clearFails(){ls.del('vip_fails');ls.del('vip_lock')}

/* ---------- views ---------- */
function renderLogin(){
 let msg='';try{msg=sessionStorage.getItem('vip_msg')||'';sessionStorage.removeItem('vip_msg')}catch(e){}
 view.innerHTML=`<section class="page login stg"><div class="logo glass">${ic('crown')}</div><h1>Welcome<br>back</h1><p class="eyebrow" style="margin-top:6px">Sign in with your VIP UUID</p>
 <div class="card glass" style="margin-top:22px"><label for="u">UUID</label><div class="field"><input id="u" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="sm" id="pa" aria-label="Paste" style="height:52px;width:52px;padding:0;justify-content:center">${ic('paste')}</button></div>
 <button class="btn" id="go">Login</button><p class="err" id="er" role="alert">${esc(msg)}</p></div></section>`;
 const u=document.getElementById('u'),b=document.getElementById('go'),er=document.getElementById('er');let tm=0,locked=false;
 const bad=m=>{er.textContent=m;er.classList.remove('shake');void er.offsetWidth;er.classList.add('shake')};
 const tick=()=>{clearTimeout(tm);const s=lockLeft();
  if(s>0){locked=true;u.disabled=b.disabled=true;b.textContent='Wait '+mmss(s);er.textContent='Too many failed attempts. Please wait to login again.';tm=setTimeout(tick,1000)}
  else if(locked){locked=false;u.disabled=b.disabled=false;b.textContent='Login';er.textContent='';u.focus()}};
 const run=async()=>{if(lockLeft()>0)return tick();const v=u.value.trim().toLowerCase();er.textContent='';
  if(!UU.test(v)&&!D){bad('Enter a valid UUID');return}
  b.disabled=true;b.textContent='Checking…';
  try{const j=await api('login',{uuid:v});clearFails();ls.set('vip_token',j.token);S.data=j;S.at=Date.now();go('dashboard')}
  catch(e){b.disabled=false;b.textContent='Login';
   if(e.code===400||e.code===404||e.code===429){const n=addFail(e.code);if(lockLeft()>0)return tick();bad(e.message+(n<3?' ('+(3-n)+' '+(3-n===1?'try':'tries')+' left before a wait)':''))}
   else bad(e.message)}};
 b.onclick=run;u.onkeydown=e=>{if(e.key==='Enter')run()};
 document.getElementById('pa').onclick=async()=>{try{const t=(await navigator.clipboard.readText()).trim();if(t){u.value=t;run()}}catch(e){u.focus();toast('Long-press the field to paste')}};
 tick();
}
function dashHTML(d){
 const m=d.member,b=d.bandwidth,now=Date.now()/1000,left=Math.max(0,Math.ceil((m.expires-now)/86400)),act=m.expires>now&&m.status==='active';
 const used=(b.up||0)+(b.down||0),unl=b.unlimited||!b.quota,pct=unl?0:Math.min(1,used/b.quota),dp=m.days?Math.min(1,left/m.days):0,c=2*Math.PI*44;
 return`${top()}<div><p class="eyebrow">Hello, ${esc(d.uuid.slice(0,8).toUpperCase())}</p><h1>Stay<br>connected</h1></div>
 <article class="card glass heroc" style="margin-top:22px"><div class="ring"><svg viewBox="0 0 104 104"><defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#b793ff"/><stop offset="1" stop-color="#6a43f0"/></linearGradient></defs><circle class="t" cx="52" cy="52" r="44"/><circle class="v" cx="52" cy="52" r="44" stroke="url(#rg)" style="--c:${c};--to:${c*(1-dp)}"/></svg><div><b>${left}</b><small>days left</small></div></div>
 <div><span class="badge ${act?'':'x'}">${act?'Active':'Expired'}</span><h2>Membership</h2><p>${fd(m.created)} → ${fd(m.expires)}</p></div></article>
 <article class="card glass"><div class="cardhd"><span>Bandwidth</span><small>${unl?'Unlimited plan':fb(b.quota)+' plan'}</small></div>
 <div class="big" style="margin-top:8px">${fb(used)} <small>${unl?'used':'of '+fb(b.quota)}</small></div><div class="bar"><u style="--p:${unl?1:pct}"></u></div>
 <div class="stats"><div><span>Download</span><b>${fb(b.down)}</b></div><div><span>Upload</span><b>${fb(b.up)}</b></div><div><span>Remaining</span><b>${unl?'∞':fb(Math.max(0,b.quota-used))}</b></div></div></article>
 <article class="card glass"><div class="cardhd"><span>Your login ID</span></div><div class="uu"><code>${esc(d.uuid)}</code><button class="sm" data-act="copyuuid">${ic('copy')}Copy</button></div></article>
 <button class="btn" data-act="go" data-to="servers">Connect now ${ic('arrow')}</button>`;
}
const netsHTML=d=>nets(d).map(n=>`<button class="chip ${n.id===S.pref.net?'on':''}" data-act="net" data-id="${esc(n.id)}">${esc(n.name)}</button>`).join('')||'<small style="padding:8px 14px;color:var(--mut)">No networks</small>';
const srvHTML=d=>{const q={Excellent:'#2fb67c',Good:'#7bc043',Fair:'#f0a43a'};return vis(d).map(s=>`<button class="srv ${s.id===S.pref.srv?'on':''}" data-act="srv" data-id="${esc(s.id)}"><img class="flag" src="${esc(s.flag)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${esc(s.name)}<small><i class="dot" style="background:${q[s.quality]||'#aaa'}"></i>${esc(s.quality)}</small></span><span class="ms">${+s.ping||'–'} ms</span><span class="tick">${ic('check')}</span></button>`).join('')||'<p class="note" style="padding:10px 12px;margin:0">No servers for this network.</p>'};
function appsHTML(d){const p=plat(),L=(d.apps||[]).slice().sort((a,b)=>!!b[p]-!!a[p]);
 return L.map(a=>{const dl=a[p]||a.ios||a.android||a.pc,id=esc(a.id);
  return`<div class="app"><button class="main" data-act="import" data-id="${id}">${tileOf(a)}<span class="nm">${esc(a.name)}<small>${esc(a.sub)}</small></span></button>
  <button class="sm ic" data-act="copyapp" data-id="${id}" title="Copy subscription URL" aria-label="Copy ${esc(a.name)} subscription URL">${ic('copy')}</button>${dl?`<a class="sm ic" href="${esc(dl)}" target="_blank" rel="noopener" title="Get ${esc(a.name)}" aria-label="Download ${esc(a.name)}">${ic('dl')}</a>`:''}</div>`}).join('')||'<p class="note" style="padding:10px 12px;margin:0">No apps listed.</p>'}
function serversHTML(d){
 return`${top()}<div><p class="eyebrow">Connection preferences</p><h1>Pick your<br>route</h1></div>
 <div class="sec"><span>Network</span></div><div class="chips glass" id="nets">${netsHTML(d)}</div>
 <div class="sec"><span>Servers</span><small id="cnt">${vis(d).length} available</small></div><div class="list glass" id="sv">${srvHTML(d)}</div>
 <div class="sec"><span>Supported apps</span><small>tap to import</small></div><div class="list glass" id="ap">${appsHTML(d)}</div>
 <p class="note">Tap an app to import your subscription automatically, or tap the copy button to copy its subscription URL.</p>`;
}
function paint(d,ids){const m={nets:['nets',netsHTML],sv:['sv',srvHTML],ap:['ap',appsHTML]};ids.forEach(k=>{const el=document.getElementById(m[k][0]);if(el)el.innerHTML=m[k][1](d)});const c=document.getElementById('cnt');if(c)c.textContent=vis(d).length+' available'}

/* ---------- subscription: encrypted URL copy + import (same as the PHP site) ---------- */
async function happLink(){const n=S.pref.net;if(S.happ[n])return S.happ[n];
 const j=await api('happ',{token:ls.get('vip_token'),net:n}),l=String(j.link||'');if(!/^happ:\/\//i.test(l))throw new Error('Could not create the encrypted link, try again');S.happ[n]=l;return l}
const prefetch=d=>{if((d.apps||[]).some(isHapp)&&subFor(d))happLink().catch(()=>{})};   /* ready before the tap, so the app opens instantly */
async function linkFor(a,d){if(isHapp(a))return happLink();const r=subFor(d,a);if(!r)throw new Error('Subscription link is not enabled on the server');return r}
async function copyApp(a,btn){try{copy(await linkFor(a,S.data),btn)}catch(e){toast(e.message)}}
async function importApp(a){const d=S.data;let l;
 try{l=await linkFor(a,d)}catch(e){return toast(e.message)}
 if(isHapp(a)){copy(l);location.href=l;return}
 const k=importLink(a,l,(netName(d)||'AnajakVPN VIP').toUpperCase());if(!k)return toast('This app has no import link');
 toast('Opening '+a.name+'…');const t=setTimeout(()=>{if(!document.hidden)toast('App didn’t open? Install it with “Get”, then use the copy button.')},1800);
 document.addEventListener('visibilitychange',()=>clearTimeout(t),{once:true});location.href=k}

/* ---------- router ---------- */
let rid=0;
const skeleton=()=>`<section class="page">${top()}<div class="sk" style="margin-top:90px"></div><div class="sk"></div><div class="sk" style="height:110px"></div></section>`;
function show(pg,d,still){if(pg==='servers')prefetch(d);view.innerHTML=`<section class="page stg${still?' still':''}">${pg==='servers'?serversHTML(d):dashHTML(d)}</section>`}
function fail(e){view.innerHTML=`<section class="page"><div class="card glass center" style="margin-top:120px"><h1 style="font-size:26px">Something went wrong</h1><p>${esc(e.message)}${/domain/i.test(e.message)?'<br><small>Add this website’s domain in Admin › Website API.</small>':''}</p><button class="btn" data-act="retry">Try again</button><button class="sm" data-act="logout" style="margin-top:12px">Log out</button></div></section>`}
async function route(){
 const id=++rid;let pg=location.hash.replace(/^#\/?/,'').replace('.html','');if(pg==='apps')pg='servers';
 const authed=!!ls.get('vip_token')||D;
 if(!['dashboard','servers','login'].includes(pg))pg=authed?'dashboard':'login';
 if(pg!=='login'&&!authed)pg='login';
 window.scrollTo(0,0);
 if(pg==='login'){tabs.classList.add('off');renderLogin();return}
 tabs.classList.remove('off');tabs.classList.toggle('s1',pg==='servers');tabs.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.p===pg));
 if(S.data){fixPref(S.data);show(pg,S.data,false);
  if(Date.now()-S.at>45000){try{const d=await fetchMe();if(id===rid){fixPref(d);show(pg,d,true)}}catch(e){if(e.code===401)expire(e)}}return}
 view.innerHTML=skeleton();
 try{const d=await fetchMe();if(id!==rid)return;fixPref(d);show(pg,d,false)}catch(e){if(id!==rid)return;e.code===401?expire(e):fail(e)}
}
function expire(e){ls.del('vip_token');S.data=null;try{sessionStorage.setItem('vip_msg',e.message)}catch(x){}go('login')}

/* ---------- events (one delegated listener) ---------- */
view.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const d=S.data,a=t.dataset.act;
 if(a==='logout'){ls.del('vip_token');S.data=null;go('login')}
 else if(a==='go')go(t.dataset.to);
 else if(a==='retry')route();
 else if(a==='copyuuid'&&d)copy(d.uuid,t);
 else if(a==='copyapp'&&d){const x=(d.apps||[]).find(z=>z.id===t.dataset.id);if(x)copyApp(x,t)}
 else if(a==='import'&&d){const x=(d.apps||[]).find(z=>z.id===t.dataset.id);if(x)importApp(x)}
 else if(a==='net'&&d){S.pref.net=t.dataset.id;S.pref.srv='';fixPref(d);paint(d,['nets','sv','ap']);prefetch(d)}
 else if(a==='srv'&&d){S.pref.srv=t.dataset.id;ls.set('vip_srv',S.pref.srv);view.querySelectorAll('.srv').forEach(x=>x.classList.toggle('on',x===t))}
});
addEventListener('hashchange',route);route();
})();
</script></body></html>
